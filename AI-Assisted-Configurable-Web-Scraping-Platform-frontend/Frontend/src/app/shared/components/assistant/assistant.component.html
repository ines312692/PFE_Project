<button class="assistant-trigger" (click)="toggle()" [class.assistant-trigger--open]="isOpen()">
  @if (!isOpen()) {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    @if (unread() > 0) {
      <span class="assistant-trigger__badge">{{ unread() }}</span>
    }
  } @else {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  }
</button>
@if (isOpen()) {
  <div class="assistant" (click)="$event.stopPropagation()">
    <div class="assistant__header">
      <div class="assistant__avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        </svg>
      </div>
      <div class="assistant__header-info">
        <span class="assistant__header-name">Scraping Assistant</span>
        <span class="assistant__header-status">
          <span class="assistant__status-dot"></span>
          Online
        </span>
      </div>
      <button class="assistant__close" (click)="close()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="assistant__messages">
      @for (msg of messages(); track msg.id) {
        <div class="msg" [class.msg--bot]="msg.sender === 'bot'" [class.msg--user]="msg.sender === 'user'">
          @if (msg.sender === 'bot') {<!-- LE ROBOT -->
            <div class="msg__avatar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
              </svg>
            </div>
          }
          <div class="msg__content">
            <div class="msg__bubble">{{ msg.text }}</div>
            <span class="msg__time">{{ msg.time }}</span>
            @if (msg.actions && msg.actions.length > 0) {
              <div class="msg__actions">
                @for (action of msg.actions; track action.label) {
                  <button class="quick-btn" (click)="onQuickAction(action)">
                    @switch (action.icon) {
                      @case ('plus') {
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                      }
                      @case ('list') {
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                          <line x1="8" y1="6" x2="21" y2="6"/>
                          <line x1="8" y1="12" x2="21" y2="12"/>
                          <line x1="8" y1="18" x2="21" y2="18"/>
                          <line x1="3" y1="6" x2="3.01" y2="6"/>
                          <line x1="3" y1="12" x2="3.01" y2="12"/>
                          <line x1="3" y1="18" x2="3.01" y2="18"/>
                        </svg>
                      }
                      @case ('help') {
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                          <circle cx="12" cy="12" r="10"/>
                          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                          <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                      }
                      @case ('code') {
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                          <polyline points="16 18 22 12 16 6"/>
                          <polyline points="8 6 2 12 8 18"/>
                        </svg>
                      }
                    }
                    {{ action.label }}
                  </button>
                }
              </div>
            }
          </div>
        </div>
      }
    </div>
    <div class="assistant__input">
      <input type="text"
             class="assistant__input-field"
             [(ngModel)]="inputText"
             (keydown.enter)="sendMessage()"
             placeholder="Ask me anything..."
             autocomplete="off"/>
      <button class="assistant__send" (click)="sendMessage()" [disabled]="!inputText.trim()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
}
