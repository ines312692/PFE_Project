auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Loki est tres bavard au demarrage ; warn suffit en dev.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retention de 7 jours : au-dela, les logs de dev n'ont plus d'interet
  # et le disque se remplit vite.
  retention_period: 168h
  # Permet d'attacher des metadonnees (traceId, jobId...) sans en faire
  # des labels — evite l'explosion de cardinalite.
  allow_structured_metadata: true
  # Quarkus en DEBUG produit beaucoup de lignes ; on relache les quotas
  # par defaut qui sont calibres pour de la production multi-tenant.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# Desactive le telemetry anonyme vers Grafana Labs
analytics:
  reporting_enabled: false
