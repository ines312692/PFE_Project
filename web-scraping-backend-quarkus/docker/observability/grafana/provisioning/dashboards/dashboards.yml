apiVersion: 1

providers:
  - name: elya-dashboards
    orgId: 1
    folder: "Elya Scraper"
    folderUid: elya-scraper-folder
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
