apiVersion: 1

datasources:
  - name: Prometheus
    uid: elya-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s

  - name: Loki
    uid: elya-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: jobId
          matcherRegex: "job[= ]([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"
          url: '/explore?left={"datasource":"elya-loki","queries":[{"expr":"{job=\"elya-scraper\"} |= \"$${__value.raw}\""}]}'
          datasourceUid: elya-loki
